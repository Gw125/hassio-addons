version: "0.70.1"
slug: frpc
name: frp 客户端 (frpc)
description: 通过 frp 内网穿透，从外网远程访问 Home Assistant
url: https://github.com/fatedier/frp
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
options:
  server_addr: "你的服务器公网IP"
  server_port: 7000
  token: "改成和服务端一致的token"
  local_ip: homeassistant
  local_port: 8123
  remote_port: 8123
schema:
  server_addr: str
  server_port: port
  token: str
  local_ip: str
  local_port: port
  remote_port: port
